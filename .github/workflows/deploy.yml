name: Deploy

# Production deploy. Requires the CLOUDFLARE_API_TOKEN secret
# (permissions: Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  worker:
    name: worker → Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply study-platform --remote
      - name: Deploy worker
        run: npx wrangler deploy

  frontend:
    name: frontend → Cloudflare Pages
    runs-on: ubuntu-latest
    needs: worker
    defaults:
      run:
        working-directory: platform/frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Pages
        run: npx wrangler pages deploy dist --project-name devgrind --branch main
